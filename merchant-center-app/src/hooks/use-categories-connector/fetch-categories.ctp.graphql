query FetchCategories($limit: Int!, $offset: Int!, $sort: [String!]) {
  categories(limit: $limit, offset: $offset, sort: $sort) {
    total
    count
    offset
    results {
      id
      key
      childCount
      stagedProductCount
      orderHint
      nameAllLocales {
        locale
        value
      }
    }
  }
}
