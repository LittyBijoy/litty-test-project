deployAs:
  - name: merchant-center-app
    applicationType: merchant-center-custom-application
    configuration:
      standardConfiguration:
        - key: CUSTOM_APPLICATION_ID
          description: The Custom Application ID (Merchant Center → Settings → Custom Applications)
          required: true
          default: cmudrdtao000e01zxzxelpowc
        - key: ENTRY_POINT_URI_PATH
          description: The Custom Application's entry point URI path
          required: true
          default: litty_test_custom_app
        - key: CLOUD_IDENTIFIER
          description: The cloud identifier — must match the project's region
          required: true
          default: gcp-us
